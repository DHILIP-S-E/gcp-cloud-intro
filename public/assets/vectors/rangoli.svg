<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="goldStrokeRangoli" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C76B" />
      <stop offset="50%" stop-color="#FF9D36" />
      <stop offset="100%" stop-color="#C73532" />
    </linearGradient>
    <radialGradient id="rangoliGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C76B" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#FF9D36" stop-opacity="0.08" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Center Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#rangoliGlowGrad)" />

  <!-- Outer Concentric Circles -->
  <circle cx="200" cy="200" r="190" stroke="url(#goldStrokeRangoli)" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="200" cy="200" r="175" stroke="#F5C76B" stroke-width="2" opacity="0.6" />
  <circle cx="200" cy="200" r="162" stroke="#FF9D36" stroke-width="1" stroke-dasharray="3 5" />

  <!-- 16 Outer Flame Lotus Petals -->
  <g id="outerPetals">
    <!-- 0 deg -->
    <g transform="rotate(0 200 200)"><path d="M200 25 C 190 60, 192 100, 200 120 C 208 100, 210 60, 200 25 Z" fill="#C73532" fill-opacity="0.3" stroke="#F5C76B" stroke-width="1.5"/><circle cx="200" cy="30" r="3" fill="#F5C76B"/><circle cx="200" cy="50" r="2" fill="#FFF1D6"/></g>
    <!-- 22.5 deg -->
    <g transform="rotate(22.5 200 200)"><path d="M200 25 C 190 60, 192 100, 200 120 C 208 100, 210 60, 200 25 Z" fill="#C73532" fill-opacity="0.3" stroke="#F5C76B" stroke-width="1.5"/><circle cx="200" cy="30" r="3" fill="#F5C76B"/><circle cx="200" cy="50" r="2" fill="#FFF1D6"/></g>
    <!-- 45 deg -->
    <g transform="rotate(45 200 200)"><path d="M200 25 C 190 60, 192 100, 200 120 C 208 100, 210 60, 200 25 Z" fill="#C73532" fill-opacity="0.3" stroke="#F5C76B" stroke-width="1.5"/><circle cx="200" cy="30" r="3" fill="#F5C76B"/><circle cx="200" cy="50" r="2" fill="#FFF1D6"/></g>
    <!-- 67.5 deg -->
    <g transform="rotate(67.5 200 200)"><path d="M200 25 C 190 60, 192 100, 200 120 C 208 100, 210 60, 200 25 Z" fill="#C73532" fill-opacity="0.3" stroke="#F5C76B" stroke-width="1.5"/><circle cx="200" cy="30" r="3" fill="#F5C76B"/><circle cx="200" cy="50" r="2" fill="#FFF1D6"/></g>
    <!-- 90 deg -->
    <g transform="rotate(90 200 200)"><path d="M200 25 C 190 60, 192 100, 200 120 C 208 100, 210 60, 200 25 Z" fill="#C73532" fill-opacity="0.3" stroke="#F5C76B" stroke-width="1.5"/><circle cx="200" cy="30" r="3" fill="#F5C76B"/><circle cx="200" cy="50" r="2" fill="#FFF1D6"/></g>
    <!-- 112.5 deg -->
    <g transform="rotate(112.5 200 200)"><path d="M200 25 C 190 60, 192 100, 200 120 C 208 100, 210 60, 200 25 Z" fill="#C73532" fill-opacity="0.3" stroke="#F5C76B" stroke-width="1.5"/><circle cx="200" cy="30" r="3" fill="#F5C76B"/><circle cx="200" cy="50" r="2" fill="#FFF1D6"/></g>
    <!-- 135 deg -->
    <g transform="rotate(135 200 200)"><path d="M200 25 C 190 60, 192 100, 200 120 C 208 100, 210 60, 200 25 Z" fill="#C73532" fill-opacity="0.3" stroke="#F5C76B" stroke-width="1.5"/><circle cx="200" cy="30" r="3" fill="#F5C76B"/><circle cx="200" cy="50" r="2" fill="#FFF1D6"/></g>
    <!-- 157.5 deg -->
    <g transform="rotate(157.5 200 200)"><path d="M200 25 C 190 60, 192 100, 200 120 C 208 100, 210 60, 200 25 Z" fill="#C73532" fill-opacity="0.3" stroke="#F5C76B" stroke-width="1.5"/><circle cx="200" cy="30" r="3" fill="#F5C76B"/><circle cx="200" cy="50" r="2" fill="#FFF1D6"/></g>
    <!-- 180 deg -->
    <g transform="rotate(180 200 200)"><path d="M200 25 C 190 60, 192 100, 200 120 C 208 100, 210 60, 200 25 Z" fill="#C73532" fill-opacity="0.3" stroke="#F5C76B" stroke-width="1.5"/><circle cx="200" cy="30" r="3" fill="#F5C76B"/><circle cx="200" cy="50" r="2" fill="#FFF1D6"/></g>
    <!-- 202.5 deg -->
    <g transform="rotate(202.5 200 200)"><path d="M200 25 C 190 60, 192 100, 200 120 C 208 100, 210 60, 200 25 Z" fill="#C73532" fill-opacity="0.3" stroke="#F5C76B" stroke-width="1.5"/><circle cx="200" cy="30" r="3" fill="#F5C76B"/><circle cx="200" cy="50" r="2" fill="#FFF1D6"/></g>
    <!-- 225 deg -->
    <g transform="rotate(225 200 200)"><path d="M200 25 C 190 60, 192 100, 200 120 C 208 100, 210 60, 200 25 Z" fill="#C73532" fill-opacity="0.3" stroke="#F5C76B" stroke-width="1.5"/><circle cx="200" cy="30" r="3" fill="#F5C76B"/><circle cx="200" cy="50" r="2" fill="#FFF1D6"/></g>
    <!-- 247.5 deg -->
    <g transform="rotate(247.5 200 200)"><path d="M200 25 C 190 60, 192 100, 200 120 C 208 100, 210 60, 200 25 Z" fill="#C73532" fill-opacity="0.3" stroke="#F5C76B" stroke-width="1.5"/><circle cx="200" cy="30" r="3" fill="#F5C76B"/><circle cx="200" cy="50" r="2" fill="#FFF1D6"/></g>
    <!-- 270 deg -->
    <g transform="rotate(270 200 200)"><path d="M200 25 C 190 60, 192 100, 200 120 C 208 100, 210 60, 200 25 Z" fill="#C73532" fill-opacity="0.3" stroke="#F5C76B" stroke-width="1.5"/><circle cx="200" cy="30" r="3" fill="#F5C76B"/><circle cx="200" cy="50" r="2" fill="#FFF1D6"/></g>
    <!-- 292.5 deg -->
    <g transform="rotate(292.5 200 200)"><path d="M200 25 C 190 60, 192 100, 200 120 C 208 100, 210 60, 200 25 Z" fill="#C73532" fill-opacity="0.3" stroke="#F5C76B" stroke-width="1.5"/><circle cx="200" cy="30" r="3" fill="#F5C76B"/><circle cx="200" cy="50" r="2" fill="#FFF1D6"/></g>
    <!-- 315 deg -->
    <g transform="rotate(315 200 200)"><path d="M200 25 C 190 60, 192 100, 200 120 C 208 100, 210 60, 200 25 Z" fill="#C73532" fill-opacity="0.3" stroke="#F5C76B" stroke-width="1.5"/><circle cx="200" cy="30" r="3" fill="#F5C76B"/><circle cx="200" cy="50" r="2" fill="#FFF1D6"/></g>
    <!-- 337.5 deg -->
    <g transform="rotate(337.5 200 200)"><path d="M200 25 C 190 60, 192 100, 200 120 C 208 100, 210 60, 200 25 Z" fill="#C73532" fill-opacity="0.3" stroke="#F5C76B" stroke-width="1.5"/><circle cx="200" cy="30" r="3" fill="#F5C76B"/><circle cx="200" cy="50" r="2" fill="#FFF1D6"/></g>
  </g>

  <!-- Middle Ring of 8 Grand Petals -->
  <circle cx="200" cy="200" r="120" stroke="#F5C76B" stroke-width="1.5" opacity="0.7" />
  <g id="midPetals">
    <g transform="rotate(22.5 200 200)"><path d="M200 80 C 175 130, 185 160, 200 170 C 215 160, 225 130, 200 80 Z" fill="#FF9D36" fill-opacity="0.3" stroke="#F5C76B" stroke-width="2"/><path d="M200 95 L200 155" stroke="#FFF1D6" stroke-width="1" stroke-dasharray="2 3"/></g>
    <g transform="rotate(67.5 200 200)"><path d="M200 80 C 175 130, 185 160, 200 170 C 215 160, 225 130, 200 80 Z" fill="#FF9D36" fill-opacity="0.3" stroke="#F5C76B" stroke-width="2"/><path d="M200 95 L200 155" stroke="#FFF1D6" stroke-width="1" stroke-dasharray="2 3"/></g>
    <g transform="rotate(112.5 200 200)"><path d="M200 80 C 175 130, 185 160, 200 170 C 215 160, 225 130, 200 80 Z" fill="#FF9D36" fill-opacity="0.3" stroke="#F5C76B" stroke-width="2"/><path d="M200 95 L200 155" stroke="#FFF1D6" stroke-width="1" stroke-dasharray="2 3"/></g>
    <g transform="rotate(157.5 200 200)"><path d="M200 80 C 175 130, 185 160, 200 170 C 215 160, 225 130, 200 80 Z" fill="#FF9D36" fill-opacity="0.3" stroke="#F5C76B" stroke-width="2"/><path d="M200 95 L200 155" stroke="#FFF1D6" stroke-width="1" stroke-dasharray="2 3"/></g>
    <g transform="rotate(202.5 200 200)"><path d="M200 80 C 175 130, 185 160, 200 170 C 215 160, 225 130, 200 80 Z" fill="#FF9D36" fill-opacity="0.3" stroke="#F5C76B" stroke-width="2"/><path d="M200 95 L200 155" stroke="#FFF1D6" stroke-width="1" stroke-dasharray="2 3"/></g>
    <g transform="rotate(247.5 200 200)"><path d="M200 80 C 175 130, 185 160, 200 170 C 215 160, 225 130, 200 80 Z" fill="#FF9D36" fill-opacity="0.3" stroke="#F5C76B" stroke-width="2"/><path d="M200 95 L200 155" stroke="#FFF1D6" stroke-width="1" stroke-dasharray="2 3"/></g>
    <g transform="rotate(292.5 200 200)"><path d="M200 80 C 175 130, 185 160, 200 170 C 215 160, 225 130, 200 80 Z" fill="#FF9D36" fill-opacity="0.3" stroke="#F5C76B" stroke-width="2"/><path d="M200 95 L200 155" stroke="#FFF1D6" stroke-width="1" stroke-dasharray="2 3"/></g>
    <g transform="rotate(337.5 200 200)"><path d="M200 80 C 175 130, 185 160, 200 170 C 215 160, 225 130, 200 80 Z" fill="#FF9D36" fill-opacity="0.3" stroke="#F5C76B" stroke-width="2"/><path d="M200 95 L200 155" stroke="#FFF1D6" stroke-width="1" stroke-dasharray="2 3"/></g>
  </g>

  <!-- Sacred Geometric Stars & Diya Motifs -->
  <polygon
    points="200,130 249,179 270,165 249,221 270,235 200,270 151,221 130,235 151,179 130,165"
    fill="none"
    stroke="#F5C76B"
    stroke-width="1.5"
  />

  <!-- Inner Lotus Core -->
  <circle cx="200" cy="200" r="50" stroke="#FF9D36" stroke-width="2" />
  <circle cx="200" cy="200" r="32" fill="#C73532" fill-opacity="0.4" stroke="#F5C76B" stroke-width="2" />

  <!-- 8 Inner Core Teardrop Petals -->
  <g id="corePetals">
    <ellipse cx="200" cy="175" rx="5" ry="12" fill="#F5C76B" />
    <g transform="rotate(45 200 200)"><ellipse cx="200" cy="175" rx="5" ry="12" fill="#F5C76B" /></g>
    <g transform="rotate(90 200 200)"><ellipse cx="200" cy="175" rx="5" ry="12" fill="#F5C76B" /></g>
    <g transform="rotate(135 200 200)"><ellipse cx="200" cy="175" rx="5" ry="12" fill="#F5C76B" /></g>
    <g transform="rotate(180 200 200)"><ellipse cx="200" cy="175" rx="5" ry="12" fill="#F5C76B" /></g>
    <g transform="rotate(225 200 200)"><ellipse cx="200" cy="175" rx="5" ry="12" fill="#F5C76B" /></g>
    <g transform="rotate(270 200 200)"><ellipse cx="200" cy="175" rx="5" ry="12" fill="#F5C76B" /></g>
    <g transform="rotate(315 200 200)"><ellipse cx="200" cy="175" rx="5" ry="12" fill="#F5C76B" /></g>
  </g>

  <!-- Center Bindu -->
  <circle cx="200" cy="200" r="10" fill="#FFF1D6" />
  <circle cx="200" cy="200" r="4" fill="#C73532" />
</svg>

