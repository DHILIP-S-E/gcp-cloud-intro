<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" fill="none">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9D36" />
      <stop offset="50%" stop-color="#F5C76B" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#F5C76B" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Tech Crest -->
  <polygon points="35,12 55,23 55,47 35,58 15,47 15,23" fill="#111629" stroke="url(#aiGrad)" stroke-width="2" />
  
  <!-- AI Neural Network Nodes -->
  <circle cx="35" cy="25" r="3" fill="#38BDF8" />
  <circle cx="25" cy="42" r="3" fill="#F5C76B" />
  <circle cx="45" cy="42" r="3" fill="#FF9D36" />
  <line x1="35" y1="25" x2="25" y2="42" stroke="#FFF1D6" stroke-width="1" opacity="0.6" />
  <line x1="35" y1="25" x2="45" y2="42" stroke="#FFF1D6" stroke-width="1" opacity="0.6" />
  <line x1="25" y1="42" x2="45" y2="42" stroke="#FFF1D6" stroke-width="1" opacity="0.6" />
  <circle cx="35" cy="35" r="2" fill="#FFFBEB" />

  <!-- Typography -->
  <text x="70" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#FFFBEB" letter-spacing="1">
    Openmadur<tspan fill="#38BDF8">AI</tspan>
  </text>
  <text x="70" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#F5C76B" letter-spacing="2">
    COMMUNITY
  </text>

  <!-- Sparkle Accent -->
  <path d="M220 18 L222 24 L228 26 L222 28 L220 34 L218 28 L212 26 L218 24 Z" fill="url(#sparkGrad)" />
</svg>

