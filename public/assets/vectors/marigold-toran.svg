<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 48" fill="none">
  <defs>
    <radialGradient id="marigoldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FF9D36" />
      <stop offset="85%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#BF360C" />
    </radialGradient>
    <linearGradient id="mangoLeafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
  </defs>

  <!-- Auspicious Red & Gold Thread -->
  <path
    d="M0 8 Q 150 28 300 8 Q 450 28 600 8 Q 750 28 900 8 Q 1050 28 1200 8"
    stroke="#C73532"
    stroke-width="3"
    fill="none"
  />
  <path
    d="M0 8 Q 150 28 300 8 Q 450 28 600 8 Q 750 28 900 8 Q 1050 28 1200 8"
    stroke="#F5C76B"
    stroke-width="1.5"
    stroke-dasharray="4 6"
    fill="none"
  />

